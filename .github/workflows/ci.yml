name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    name: Lint, type-check, build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v7
        with:
          node-version: "20"
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

      - name: No known vulnerabilities in production dependencies
        run: npm audit --omit=dev --audit-level=high

  # The whole app in Docker (Postgres, backend, Mailpit, this frontend) and
  # the Playwright suite, via the backend repo's scripts/ci-e2e.sh. Needs the
  # repository variable BACKEND_REPOSITORY (owner/name) and, if that repo is
  # private, a CROSS_REPO_TOKEN secret that can read it.
  e2e:
    name: End-to-end (full stack)
    runs-on: ubuntu-latest
    needs: build
    if: vars.BACKEND_REPOSITORY != ''
    timeout-minutes: 30
    steps:
      - name: Checkout frontend
        uses: actions/checkout@v5
        with:
          path: frontend

      - name: Checkout backend
        uses: actions/checkout@v5
        with:
          repository: ${{ vars.BACKEND_REPOSITORY }}
          token: ${{ secrets.CROSS_REPO_TOKEN || github.token }}
          path: backend

      - uses: actions/setup-node@v7
        with:
          node-version: "20"

      - name: Run the stack and the e2e suite
        run: backend/scripts/ci-e2e.sh frontend

      - name: Upload Playwright results
        if: failure()
        uses: actions/upload-artifact@v6
        with:
          name: playwright-results
          path: frontend/test-results/
