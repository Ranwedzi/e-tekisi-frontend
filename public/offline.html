<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#FFD217" />
    <title>e-Tekisi: offline</title>
    <style>
      body {
        margin: 0;
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        background: #f5f5f7;
        color: #1a1a1a;
        font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
        padding: 24px;
        box-sizing: border-box;
      }
      main {
        max-width: 360px;
        text-align: center;
      }
      .logo {
        width: 72px;
        height: 72px;
        margin: 0 auto 24px;
        border-radius: 22px;
        background: #ffd217;
        display: flex;
        align-items: center;
        justify-content: center;
        font-weight: 900;
        font-size: 40px;
      }
      h1 {
        font-size: 24px;
        font-weight: 900;
        margin: 0 0 8px;
      }
      p {
        color: #6b7280;
        line-height: 1.5;
        margin: 0 0 24px;
      }
      button {
        background: #000;
        color: #fff;
        border: 0;
        border-radius: 18px;
        padding: 16px 32px;
        font-weight: 900;
        font-size: 14px;
        text-transform: uppercase;
        letter-spacing: 0.05em;
      }
    </style>
  </head>
  <body>
    <main>
      <div class="logo" aria-hidden="true">e</div>
      <h1>You're offline</h1>
      <p>e-Tekisi needs a connection to book, pay and track trips. Check your data or Wi-Fi and try again.</p>
      <button type="button" onclick="location.reload()">Try again</button>
    </main>
  </body>
</html>
